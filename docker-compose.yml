services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU25-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in a local .env file}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    networks:
      workspace:
        ipv4_address: 172.28.0.30

  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AgileWorkspaceDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=true"
      JWT__Issuer: AgileWorkspace.Api
      JWT__Audience: AgileWorkspace.Client
      JWT__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in a local .env file}
      JWT__LifetimeMinutes: ${JWT_LIFETIME_MINUTES:-60}
      Seed__EnableDemoData: "false"
      Https__Redirect: "false"
      Https__UseHsts: "false"
      Database__ApplyMigrationsOnStartup: "true"
      ForwardedHeaders__Enabled: "true"
      ForwardedHeaders__KnownProxies__0: "172.28.0.10"
      AuditLogging__RetentionCleanupEnabled: "true"
      AuditLogging__RetentionDays: ${AUDIT_LOG_RETENTION_DAYS:-30}
      AuditLogging__CleanupIntervalHours: ${AUDIT_LOG_CLEANUP_INTERVAL_HOURS:-24}
      GitHub__BaseUrl: https://api.github.com/
      GitHub__PersonalAccessToken: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      workspace:
        ipv4_address: 172.28.0.20

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4200:8080"
    restart: unless-stopped
    networks:
      workspace:
        ipv4_address: 172.28.0.10

volumes:
  sqlserver-data:

networks:
  workspace:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
